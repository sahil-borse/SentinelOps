# The dashboard's theme. Read by `streamlit run` from the project root.
# The accent and neutrals match `sentinelops.ui.view`'s design tokens; the
# injected stylesheet does the rest.

[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#F8FAFB"
secondaryBackgroundColor = "#F1F4F6"
textColor = "#111827"
font = "sans serif"
# The grid draws its own header on a canvas, out of reach of the injected
# stylesheet. This is the one lever over it: a band dark enough to separate
# the column names from the white rows beneath them.
dataframeHeaderBackgroundColor = "#E3E8EC"
dataframeBorderColor = "#E3E8EC"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
